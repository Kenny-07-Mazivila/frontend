<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>

  <div class="container">

  <!-- LEFT: FORM -->
  <div class="form-section">
    <h2>Welcome Back</h2>

    <div class="input-box">
      <input type="text" id="loginEmail" required title="Username" placeholder="Username">
      <label for="loginEmail">Username</label>
    </div>

    <div class="input-box">
      <input type="password" id="loginPassword" required title="Password" placeholder="Password">
      <label for="loginPassword">Password</label>
    </div>

    <button class="btn" onclick="login()">Login</button> <br>

    <p>Don't have an account?
      <a href="signup.html">Sign Up</a>
    </p>
  </div>

  <!-- RIGHT: SIDEBOX -->
  <div class="sidebox">
    <h1>WELCOME BACK!</h1>
    <p>We are happy to have you back.<br>
        Your next journey starts here.</p>
  </div>

</div>
  <script src="app.js"></script>
</body>
</html>
