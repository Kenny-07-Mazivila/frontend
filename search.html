<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Buildings - Campus Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles/search.css">
</head>
<body>

<header>
  <a href="/Learning/map2.html" title="Back to map">&#8592;</a>
  <h1>Search Campus Buildings</h1>
</header>

<div class="search-bar">
  <div class="search-wrapper">
    <svg viewBox="0 0 24 24"><path d="M21 19l-4.35-4.35A7.5 7.5 0 1 0 15 16.65L19.35 21 21 19zM10.5 16a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>
    <input id="search-input" type="text" placeholder="Search by name, description, or category…" autocomplete="off">
  </div>
</div>

<div class="chips" id="chips">
  <button class="chip active" data-cat="all">All</button>
  <button class="chip" data-cat="accommodation">Accommodation</button>
  <button class="chip" data-cat="academic">Academic</button>
  <button class="chip" data-cat="admin">Administration</button>
  <button class="chip" data-cat="facilities">Facilities</button>
</div>

<div class="content">
  <div id="results">
    <div class="result-count" id="result-count"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="/Learning/map2.js"></script>
<script>
function initSearchPage() {
  // Use the shared building list from map2.js so the search page stays in sync.
  const buildings = Array.isArray(window.campusBuildings) ? window.campusBuildings : [];
  const markers = window.campusMarkers || {};

const categoryMap = {
  accommodation: 'accommodation',
  academic: 'academic',
  library: 'academic',
  labs: 'academic',
  office: 'admin',
  administration: 'admin',
  entrance: 'facilities',
  parking: 'facilities',
  cafeteria: 'facilities',
  hotel: 'facilities',
  hall: 'facilities',
  gym: 'facilities'
};

function getCategory(building) {
  return categoryMap[String(building.type || 'facilities').toLowerCase()] || 'facilities';
}

// ── Category label map ──────────────────────────────────────────
const catLabels = {
  accommodation: "Accommodation",
  academic: "Academic",
  admin: "Administration",
  facilities: "Facilities",
  labs: "Labs",
  library: "Library",
  office: "Office",
  entrance: "Entrance",
  parking: "Parking",
  cafeteria: "Cafeteria",
  hotel: "Hotel",
  hall: "Hall",
  gym: "Gym"
};

// ── Map setup ──────────────────────────────────────────────────
const map = window.campusMap || L.map('map').setView([-25.4340, 30.9770], 15);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

// Campus boundary polygon
const buffer = [
  [-25.4366, 30.9865],[-25.4425, 30.9889],[-25.4432, 30.9832],
  [-25.4393, 30.9796],[-25.4374, 30.9802],[-25.4370, 30.9787],
  [-25.4363, 30.9768],[-25.4352, 30.9747],[-25.4341, 30.9722],
  [-25.4333, 30.9698],[-25.4323, 30.9686],[-25.4313, 30.9680],
  [-25.4288, 30.9677],[-25.4273, 30.9671],[-25.4254, 30.9693],
  [-25.4197, 30.9731],[-25.4201, 30.9750],[-25.4200, 30.9759],
  [-25.4197, 30.9764],[-25.4192, 30.9767],[-25.4219, 30.9772],
  [-25.4235, 30.9782],[-25.4286, 30.9789],[-25.4287, 30.9789],
  [-25.4321, 30.9844]
];

L.polygon(buffer, {
  color: '#2ecc71',
  weight: 2,
  fillColor: '#2ecc71',
  fillOpacity: 0.06
}).addTo(map);

// Existing marker layer from map2.js is reused here, so the search page stays in sync.
if (!window.campusMarkers || Object.keys(window.campusMarkers).length === 0) {
  buildings.forEach(b => {
    const marker = L.marker(b.coords, { icon: b.icon, type: b.type }).bindPopup(`<strong>${b.name}</strong><br>${b.description}`);
    marker.bindTooltip(b.name, { permanent: false, direction: 'top' });
    markers[b.name] = marker;
    marker.addTo(map);
  });
}

// ── State ──────────────────────────────────────────────────────
let activeCategory = 'all';
let searchQuery = '';
let selectedKey = null;

// ── Render results list ────────────────────────────────────────
function render() {
  const q = searchQuery.toLowerCase().trim();

  const filtered = buildings.filter(b => {
    const category = getCategory(b);
    const catMatch = activeCategory === 'all' || category === activeCategory;
    const qMatch = !q ||
      b.name.toLowerCase().includes(q) ||
      (b.description || '').toLowerCase().includes(q) ||
      catLabels[category].toLowerCase().includes(q) ||
      (b.type || '').toLowerCase().includes(q);
    return catMatch && qMatch;
  });

  const container = document.getElementById('results');
  const countEl = document.getElementById('result-count');

  // Remove old cards
  container.querySelectorAll('.card, .no-results').forEach(el => el.remove());

  countEl.textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    container.insertAdjacentHTML('beforeend', `
      <div class="no-results">
        😕 No buildings found.<br>Try a different search or category.
      </div>
    `);
    return;
  }

  filtered.forEach(b => {
    const card = document.createElement('div');
    const category = getCategory(b);
    card.className = 'card' + (selectedKey === b.name ? ' selected' : '');
    card.innerHTML = `
      <div class="card-icon">
        <img src="${b.image || (b.icon && b.icon.options && b.icon.options.iconUrl) || '/media/icons/school.png'}" alt="${b.name}">
      </div>
      <div class="card-body">
        <div class="card-name">${b.name}</div>
        <div class="card-desc">${b.description || ''}</div>
        <div class="card-tag">${catLabels[category] || 'Building'} · ${b.floors?.length || 0} floor${(b.floors?.length || 0) !== 1 ? 's' : ''}</div>
        <div style="font-size:11px;color:#666;margin-top:4px;">Type: ${b.type || 'building'} · Coords: ${b.coords?.join(', ') || 'n/a'}</div>
      </div>
    `;

    card.addEventListener('click', () => {
      selectedKey = b.name;
      render();

      map.flyTo(b.coords, 18, { duration: 1 });
      const targetMarker = (window.campusMarkers && window.campusMarkers[b.name]) || markers[b.name];
      if (targetMarker) targetMarker.openPopup();
    });

    container.appendChild(card);
  });
}

// ── Events ─────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

document.getElementById('chips').addEventListener('click', e => {
  if (!e.target.classList.contains('chip')) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  activeCategory = e.target.dataset.cat;
  render();
});

  // Initial render
  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initSearchPage);
} else {
  initSearchPage();
}

</script>
</body>
</html>
