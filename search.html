<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Buildings - Campus Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles/search.css">
</head>
<body>

<header>
  <a href="map.html" title="Back to map">&#8592;</a>
  <h1>Search Campus Buildings</h1>
</header>

<div class="search-bar">
  <div class="search-wrapper">
    <svg viewBox="0 0 24 24"><path d="M21 19l-4.35-4.35A7.5 7.5 0 1 0 15 16.65L19.35 21 21 19zM10.5 16a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>
    <input id="search-input" type="text" placeholder="Search by name, description, or category…" autocomplete="off">
  </div>
</div>

<div class="chips" id="chips">
  <button class="chip active" data-cat="all">All</button>
  <button class="chip" data-cat="accommodation">Accommodation</button>
  <button class="chip" data-cat="academic">Academic</button>
  <button class="chip" data-cat="admin">Administration</button>
  <button class="chip" data-cat="facilities">Facilities</button>
</div>

<div class="content">
  <div id="results">
    <div class="result-count" id="result-count"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="buildings.js"></script>
<script>
// ── Building data ──────────────────────────────────────────────
const buildings = [
  {
    name: "Building 1",
    key: "Building1",
    coords: [-25.4366, 30.9811],
    description: "Student accommodation for first-year students with shared facilities.",
    category: "accommodation",
    icon: "🏠",
    floors: ["Ground Floor", "1st Floor", "2nd Floor"]
  },
  {
    name: "Building 2 – Vice-Chancellor",
    key: "Building2",
    coords: [-25.4372, 30.98239],
    description: "Vice-Chancellor's office and executive administration.",
    category: "admin",
    icon: "🏛️",
    floors: ["Ground Floor", "1st Floor", "2nd Floor"]
  },
  {
    name: "Building 3 – Library",
    key: "Building3",
    coords: [-25.4369, 30.9825],
    description: "Library and study areas for students and staff.",
    category: "facilities",
    icon: "📚",
    floors: ["Ground Floor", "1st Floor", "2nd Floor"]
  },
  {
    name: "Building 4 – Auditorium",
    key: "Building4",
    coords: [-25.4362, 30.9831],
    description: "Main campus auditorium for events and graduations.",
    category: "facilities",
    icon: "🎭",
    floors: ["Ground Floor", "1st Floor", "2nd Floor", "3rd Floor"]
  },
  {
    name: "Building 5  ICT Labs",
    key: "Building5",
    coords: [-25.4356, 30.9828],
    description: "Lecture halls and ICT computer labs.",
    category: "academic",
    icon: "💻",
    floors: ["Ground Floor", "1st Floor", "2nd Floor"]
  },
  {
    name: "Building 6  Classrooms",
    key: "Building6",
    coords: [-25.4353, 30.9779],
    description: "Auditoriums and general classrooms.",
    category: "academic",
    icon: "🎓",
    floors: ["Ground Floor", "1st Floor"]
  },
  {
    name: "Building 7  Returning Students",
    key: "Building7",
    coords: [-25.4354, 30.9805],
    description: "Student accommodation for returning students with single rooms.",
    category: "accommodation",
    icon: "🏠",
    floors: ["Ground Floor", "1st Floor", "2nd Floor"]
  },
  {
    name: "Building 10W  West Wing",
    key: "Building10W",
    coords: [-25.4370, 30.9840],
    description: "West wing offices for faculty and departments.",
    category: "admin",
    icon: "🏢",
    floors: ["Ground Floor", "1st Floor", "2nd Floor"]
  },
  {
    name: "Building 10E  East Wing",
    key: "Building10E",
    coords: [-25.4370, 30.9846],
    description: "East wing offices for faculty and departments.",
    category: "admin",
    icon: "🏢",
    floors: ["Ground Floor", "1st Floor", "2nd Floor"]
  },
  
  
  {
    name: "Building 13  Postgrad Accommodation",
    key: "Building13",
    coords: [-25.4370, 30.9808],
    description: "Student accommodation for postgraduate students.",
    category: "accommodation",
    icon: "🏡",
    floors: ["Ground Floor", "1st Floor", "2nd Floor"]
  }
];

// ── Category label map ──────────────────────────────────────────
const catLabels = {
  accommodation: "Accommodation",
  academic: "Academic",
  admin: "Administration",
  facilities: "Facilities"
};

// ── Map setup ──────────────────────────────────────────────────
const map = L.map('map').setView([-25.4340, 30.9770], 15);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

// Campus boundary polygon
const buffer = [
  [-25.4366, 30.9865],[-25.4425, 30.9889],[-25.4432, 30.9832],
  [-25.4393, 30.9796],[-25.4374, 30.9802],[-25.4370, 30.9787],
  [-25.4363, 30.9768],[-25.4352, 30.9747],[-25.4341, 30.9722],
  [-25.4333, 30.9698],[-25.4323, 30.9686],[-25.4313, 30.9680],
  [-25.4288, 30.9677],[-25.4273, 30.9671],[-25.4254, 30.9693],
  [-25.4197, 30.9731],[-25.4201, 30.9750],[-25.4200, 30.9759],
  [-25.4197, 30.9764],[-25.4192, 30.9767],[-25.4219, 30.9772],
  [-25.4235, 30.9782],[-25.4286, 30.9789],[-25.4287, 30.9789],
  [-25.4321, 30.9844]
];

L.polygon(buffer, {
  color: '#2ecc71',
  weight: 2,
  fillColor: '#2ecc71',
  fillOpacity: 0.06
}).addTo(map);

// ── Markers ────────────────────────────────────────────────────
const markers = {};

buildings.forEach(b => {
  const marker = L.marker(b.coords).addTo(map);

  marker.bindTooltip(b.name, { permanent: false, direction: 'top' });

  marker.bindPopup(`
    <div style="min-width:200px">
      <strong style="font-size:15px">${b.name}</strong><br>
      <span style="color:#666;font-size:13px">${b.description}</span><br>
      <span style="color:#2ecc71;font-size:12px;font-weight:600">${catLabels[b.category]}</span><br><br>
      <strong style="font-size:13px">Floors:</strong><br>
      ${b.floors.map(f => `<span style="display:inline-block;margin:3px 4px 0 0;padding:3px 9px;background:#2ecc71;color:white;border-radius:5px;font-size:12px">${f}</span>`).join('')}
    </div>
  `);

  markers[b.key] = marker;
});

// ── State ──────────────────────────────────────────────────────
let activeCategory = 'all';
let searchQuery = '';
let selectedKey = null;

// ── Render results list ────────────────────────────────────────
function render() {
  const q = searchQuery.toLowerCase().trim();

  const filtered = buildings.filter(b => {
    const catMatch = activeCategory === 'all' || b.category === activeCategory;
    const qMatch = !q ||
      b.name.toLowerCase().includes(q) ||
      b.description.toLowerCase().includes(q) ||
      catLabels[b.category].toLowerCase().includes(q) ||
      b.key.toLowerCase().includes(q);
    return catMatch && qMatch;
  });

  const container = document.getElementById('results');
  const countEl = document.getElementById('result-count');

  // Remove old cards
  container.querySelectorAll('.card, .no-results').forEach(el => el.remove());

  countEl.textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    container.insertAdjacentHTML('beforeend', `
      <div class="no-results">
        😕 No buildings found.<br>Try a different search or category.
      </div>
    `);
    return;
  }

  filtered.forEach(b => {
    const card = document.createElement('div');
    card.className = 'card' + (selectedKey === b.key ? ' selected' : '');
    card.innerHTML = `
      <div class="card-icon">${b.icon}</div>
      <div class="card-body">
        <div class="card-name">${b.name}</div>
        <div class="card-desc">${b.description}</div>
        <div class="card-tag">${catLabels[b.category]} · ${b.floors.length} floor${b.floors.length > 1 ? 's' : ''}</div>
      </div>
    `;

    card.addEventListener('click', () => {
      selectedKey = b.key;
      render(); // re-render to show selected state

      // Fly map to marker and open popup
      map.flyTo(b.coords, 18, { duration: 1 });
      markers[b.key].openPopup();
    });

    container.appendChild(card);
  });
}

// ── Events ─────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

document.getElementById('chips').addEventListener('click', e => {
  if (!e.target.classList.contains('chip')) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  activeCategory = e.target.dataset.cat;
  render();
});

// Initial render
render();



</script>
</body>
</html>
